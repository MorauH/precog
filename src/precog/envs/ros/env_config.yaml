# Transforms run after all observations are decoded but before the snapshot
# is returned.  They have access to all keys simultaneously - use this
# when a feature depends on data from multiple topics.
#
transforms:
  - best_path_relative_sampling
  - lateral_deviation

# Keys that transforms add to the snapshot, with their output shapes.
# Used by the model-config resolution layer to derive modality input_dim.
transform_output_keys:
  best_path_relative_sampling:
    shape: [1, 18]
  lateral_deviation:
    shape: [1, 1]

actions:
  - key: steering
    topic: /cmd/steer_precog
    msg_type: std_msgs/msg/Float32
    codec: float

  - key: acceleration
    topic: /cmd/acc_precog
    msg_type: std_msgs/msg/Float32
    codec: float

# Action topics mirrored as observations, so the model can read the expert's
# commands in IMITATE mode.  Not required — only populated when the expert is
# actively publishing (i.e. IMITATE mode).
expert_action_observations:
  - key: expert_steering
    topic: /cmd/steer_auto
    msg_type: std_msgs/msg/Float32
    codec: float
    shape: [1, 1]
    max_age_sec: 0.5
    required: false

  - key: expert_acceleration
    topic: /cmd/acc_auto
    msg_type: std_msgs/msg/Float32
    codec: float
    shape: [1, 1]
    max_age_sec: 0.5
    required: false
