# env_config.yaml
#
# Declares what ROS topics are available, how to decode them, and what
# post-decode transforms to apply.
#
# shape convention
# ~~~~~~~~~~~~~~~~
#   shape: [batch_dim, ...features...]
#
#   The last element (shape[-1]) is the *input_dim* that any model
#   modality encoder consuming this key should expect.  A value of -1 in
#   any intermediate dimension means the size varies per message
#   (e.g. variable-length waypoint arrays).

qos_default:
  reliability: best_effort
  history_depth: 10

observations:

  - key: current_steering
    topic: /steering_angle
    msg_type: std_msgs/msg/Float32
    codec: float
    shape: [1, 1]
    max_age_sec: 0.2
    required: true

  - key: best_path
    topic: /pathp/best_path
    msg_type: nav_msgs/msg/Path
    codec: path
    shape: [1, -1, 2]
    max_age_sec: 0.2
    required: true

  #- key: car_state
