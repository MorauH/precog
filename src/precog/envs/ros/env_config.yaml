# env_config.yaml

qos_default:
  reliability: best_effort   # or "reliable"
  history_depth: 10

observations:

  - key: current_steering
    topic: /steering_angle
    msg_type: std_msgs/msg/Float32
    codec: float
    shape: [1, 1]
    max_age_sec: 0.2
    required: true

  - key: best_path
    topic: /pathp/best_path
    msg_type: nav_msgs/msg/Path
    codec: path
    shape: [1, -1, 2]
    max_age_sec: 0.2
    required: true

  #- key: car_state
  #  topic: /ekf/car_state #/sim?
